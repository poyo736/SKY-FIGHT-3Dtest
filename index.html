<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKY FIGHT | ダイ 3Dテスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070c1d;color:#f4f7ff;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}canvas{display:block}#ui{position:fixed;top:0;left:0;right:0;padding:16px;pointer-events:none;background:linear-gradient(#080e24df,transparent)}h1{font-size:clamp(18px,3vw,27px);margin:0;letter-spacing:.08em}small{color:#a9c5f4}#status{margin-top:8px;font-size:13px;color:#b4d4ff}#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(95vw,700px)}button{border:1px solid #7297db;border-radius:12px;background:#17284d;color:white;font-weight:700;padding:12px 15px;cursor:pointer;touch-action:manipulation}button:active{background:#3265aa}#note{position:fixed;right:12px;top:15px;color:#a9c5f4;font-size:12px;text-align:right}#error{position:fixed;top:42%;left:10%;right:10%;text-align:center;color:#ffb6b6;font-weight:700;white-space:pre-wrap;pointer-events:none} @media(max-width:620px){#note{top:85px}#controls button{padding:12px 10px}}
</style>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://esm.sh/@pixiv/three-vrm@3.2.0?external=three"}}</script></head>
<body><div id="ui"><h1>SKY FIGHT <span style="color:#71b8ff">2.5D LAB</span></h1><small>DAI / 3D MODEL TEST</small><div id="status">モデルを読み込み中…</div></div><div id="note">ドラッグ：回転　ホイール：ズーム<br>※初回はインターネット接続が必要</div><div id="error"></div><div id="controls"><button id="front">正面</button><button id="side">横向き</button><button id="back">背面</button><button id="reset">リセット</button><button id="spin">自動回転 OFF</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
const status=document.getElementById('status'), error=document.getElementById('error');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1431);scene.fog=new THREE.Fog(0x0b1431,12,25);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.05,100);camera.position.set(0,1.4,5.3);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.1,0);orbit.enableDamping=true;orbit.minDistance=1.3;orbit.maxDistance=12;orbit.update();
scene.add(new THREE.HemisphereLight(0xc9e7ff,0x2d3659,2.3));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(2,5,5);scene.add(key);const rim=new THREE.DirectionalLight(0x609aff,2);rim.position.set(-4,3,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshStandardMaterial({color:0x14264d,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const grid=new THREE.GridHelper(12,24,0x3468b5,0x203b6e);grid.position.y=.002;scene.add(grid);
let model=null,autoSpin=false;const clock=new THREE.Clock();
const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));
loader.load('./dai.vrm',gltf=>{
 model=gltf.userData.vrm;
 if(!model){throw new Error('VRMモデルとして読み込めませんでした');}
 VRMUtils.rotateVRM0?.(model); // VRM 0.x のみ補正（VRM 1.0 はそのまま）
 scene.add(model.scene);
 model.scene.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model.scene);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());
 // 地面に足を揃え、左右を中央へ
 model.scene.position.x-=center.x;model.scene.position.y-=bounds.min.y;model.scene.position.z-=center.z;
 const height=Math.max(size.y,1);orbit.target.set(0,height*.53,0);camera.position.set(0,height*.57,Math.max(height*2.0,3.6));orbit.update();
 status.textContent=`読み込み成功！ ダイの3Dモデル表示中（身長スケール ${size.y.toFixed(2)}）`;
},xhr=>{if(xhr.total)status.textContent=`読み込み中… ${Math.round(xhr.loaded/xhr.total*100)}%`;},err=>{
 console.error(err);status.textContent='読み込みに失敗しました';error.textContent='モデルを読み込めませんでした。\nローカルサーバーまたはGitHub Pagesから開いてください。\n（ファイルを直接ダブルクリックすると読み込めない場合があります）';
});
function face(angle){if(!model)return;model.scene.rotation.y=angle;}
document.getElementById('front').onclick=()=>face(0);document.getElementById('side').onclick=()=>face(Math.PI/2);document.getElementById('back').onclick=()=>face(Math.PI);document.getElementById('reset').onclick=()=>{face(0);autoSpin=false;document.getElementById('spin').textContent='自動回転 OFF';orbit.reset();};document.getElementById('spin').onclick=()=>{autoSpin=!autoSpin;document.getElementById('spin').textContent=autoSpin?'自動回転 ON':'自動回転 OFF'};
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(model){model.update(dt);if(autoSpin)model.scene.rotation.y+=dt*.65;}orbit.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
